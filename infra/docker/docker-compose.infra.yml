version: '3.8'

# Ortam altyapısı: PostgreSQL + Redis + MinIO
# Her ortam için ayrı stack olarak deploy edilir.
#
# Gerekli env değişkenleri (/opt/metnex/<env>/.env'den source edilir):
#   ENV                 = dev | test | prod
#   POSTGRES_PASSWORD
#   POSTGRES_DB         = metnex_<env>
#   REDIS_PASSWORD
#   MINIO_ROOT_USER
#   MINIO_ROOT_PASSWORD
#   MINIO_CONSOLE_PORT  = 9090 (dev) | 9091 (test) | 9092 (prod)
#
# Deploy:
#   set -a && source /opt/metnex/<env>/.env && set +a
#   docker stack deploy -c docker-compose.infra.yml metnex-infra-<env>
#
# Ön koşullar:
#   docker network create --driver overlay --attachable metnex-<env>
#   mkdir -p /datastore/<env>/{postgres,redis,minio}
#   chown -R 999:999 /datastore/<env>/postgres   # postgres uid
#
# NOT: Tek node Swarm. Birden fazla node'a ölçeklenmesi durumunda
#      bind mount yerine NFS/shared volume kullanılmalıdır.

services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - type: bind
        source: /datastore/${ENV}/postgres
        target: /var/lib/postgresql/data
      # İlk başlatmada şemaları oluşturur (platform, shared, customer_root)
      - type: bind
        source: /opt/metnex/init-db.sql
        target: /docker-entrypoint-initdb.d/init-db.sql
        read_only: true
    environment:
      POSTGRES_USER: metnex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=tr-TR --encoding=UTF8"
    networks:
      default:
        aliases:
          - postgres    # Overlay ağında sabit alias — stack adından bağımsız
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metnex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory-policy allkeys-lru
    volumes:
      - type: bind
        source: /datastore/${ENV}/redis
        target: /data
    networks:
      default:
        aliases:
          - redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # MinIO Console — sadece loopback, NPM veya SSH tüneli ile erişim
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
      # MinIO API — overlay ağı üzerinden erişilir (port expose gerekmez)
      # Gerekirse: - "127.0.0.1:${MINIO_API_PORT}:9000"
    volumes:
      - type: bind
        source: /datastore/${ENV}/minio
        target: /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      default:
        aliases:
          - minio
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    external: true
    name: metnex-${ENV}    # metnex-dev | metnex-test | metnex-prod
