name: metnex

# Geliştirme ortamı — altyapı servisleri (DB, Redis, MinIO) + opsiyonel Jasper renderer
# Uygulama servisleri (api/web) yerel olarak çalışır (pnpm dev)
#
# Port değişkenleri:
#   POSTGRES_LOCAL_PORT       (varsayılan: 5433)
#   REDIS_LOCAL_PORT          (varsayılan: 6379)
#   MINIO_API_PORT            (varsayılan: 9000)
#   MINIO_CONSOLE_PORT        (varsayılan: 9001)
#   JASPER_RENDERER_LOCAL_PORT (varsayılan: 8088)
#
# Kullanım:
#   ./dev.sh
#   ./dev.sh --stop
#   ./dev.sh --status

services:
  postgres:
    image: postgres:16-alpine
    container_name: metnex-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metnex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-metnex}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=tr-TR --encoding=UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metnex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metnex-redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_LOCAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: metnex-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Internal-only Jasper Reports HTTP render service (TASK-022.5). Optional: dev.sh only starts
  # this when it builds/finds the image. No REPORT_RENDER_INTERNAL_TOKEN -> the container still
  # starts (health stays up) but every /render call fails closed with 401 — see
  # docs/runbooks/reporting-foundation.md.
  jasper-renderer:
    build:
      context: ../..
      dockerfile: services/jasper-renderer/Dockerfile
    image: metnex-jasper-renderer:dev
    container_name: metnex-jasper-renderer-dev
    environment:
      REPORT_RENDER_INTERNAL_TOKEN: ${REPORT_RENDER_INTERNAL_TOKEN:-}
    # Loopback-only publish — never a public/0.0.0.0 bind, matching postgres/redis/minio above.
    ports:
      - "127.0.0.1:${JASPER_RENDERER_LOCAL_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    external: true
    name: openmas_postgres_data
  redis_data:
    external: true
    name: openmas_redis_data
  minio_data:
    external: true
    name: openmas_minio_data
